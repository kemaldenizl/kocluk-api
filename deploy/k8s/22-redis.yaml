apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: kocluk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kocluk
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kocluk
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379

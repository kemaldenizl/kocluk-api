# Full local stack: infrastructure (PostgreSQL, RabbitMQ, Redis) + microservices + API gateway.
#
# Usage (from repo root):
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The build context is the repository root (..) so that project references resolve
# and the Dockerfiles under build/docker/ can restore the whole solution.

name: kocluk

services:
  # ----------------------------------------------------------------------------
  # Infrastructure
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kocluk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kocluk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kocluk}
      POSTGRES_DB: ${POSTGRES_USER:-kocluk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kocluk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kocluk-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kocluk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kocluk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kocluk}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - kocluk-net

  redis:
    image: redis:7-alpine
    container_name: kocluk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kocluk-net

  # ----------------------------------------------------------------------------
  # Microservices
  # ----------------------------------------------------------------------------
  security-api:
    image: kocluk/security-api:latest
    container_name: kocluk-security-api
    build:
      context: ..
      dockerfile: build/docker/Security.API.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=kocluk_security;Username=${POSTGRES_USER:-kocluk};Password=${POSTGRES_PASSWORD:-kocluk};"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-kocluk}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-kocluk}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-SecurityService}
      Jwt__Audience: ${JWT_AUDIENCE:-SecurityService.Clients}
      IdentitySeed__AdminEmail: ${ADMIN_EMAIL:-admin@local.com}
      IdentitySeed__AdminPassword: ${ADMIN_PASSWORD:-DummyPw123!}
    ports:
      - "${SECURITY_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kocluk-net

  tenant-api:
    image: kocluk/tenant-api:latest
    container_name: kocluk-tenant-api
    build:
      context: ..
      dockerfile: build/docker/Tenant.API.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=kocluk_tenant;Username=${POSTGRES_USER:-kocluk};Password=${POSTGRES_PASSWORD:-kocluk};"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-kocluk}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-kocluk}
    ports:
      - "${TENANT_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kocluk-net

  notification-api:
    image: kocluk/notification-api:latest
    container_name: kocluk-notification-api
    build:
      context: ..
      dockerfile: build/docker/Notification.API.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=kocluk_notification;Username=${POSTGRES_USER:-kocluk};Password=${POSTGRES_PASSWORD:-kocluk};"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-kocluk}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-kocluk}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-no-reply@app.local}
    ports:
      - "${NOTIFICATION_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kocluk-net

  # ----------------------------------------------------------------------------
  # API Gateway (public entrypoint)
  # ----------------------------------------------------------------------------
  api-gateway:
    image: kocluk/api-gateway:latest
    container_name: kocluk-api-gateway
    build:
      context: ..
      dockerfile: build/docker/ApiGateway.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__security-cluster__Destinations__primary__Address: "http://security-api:8080/"
      ReverseProxy__Clusters__tenant-cluster__Destinations__primary__Address: "http://tenant-api:8080/"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      security-api:
        condition: service_healthy
      tenant-api:
        condition: service_healthy
    networks:
      - kocluk-net

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  kocluk-net:
    driver: bridge
